name: Deploy demo homepage

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'homepage/preview-assets.json'
      - 'homepage/tools/fetch_preview.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Cache the pinned web scene archive
        uses: actions/cache@v4
        with:
          path: .cache/citycode-preview
          key: citycode-web-preview-${{ hashFiles('homepage/preview-assets.json') }}
      - name: Assemble and verify the portable city
        run: python3 homepage/tools/fetch_preview.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload homepage
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
