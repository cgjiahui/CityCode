name: Release storage experiment
on:
  push:
    branches: [experiment/release-storage-20261030]
    paths:
      - .github/workflows/release-storage-probe.yml
      - .storage-probe/**
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Upload and verify small private draft Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROBE_TAG: citycode-storage-probe-20261030
        run: |
          set -euo pipefail
          mkdir -p probe-source probe-download
          gh api "repos/${GITHUB_REPOSITORY}/contents/.storage-probe/building.glb?ref=${GITHUB_SHA}" --jq .content | base64 --decode > probe-source/building.glb
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('probe-source/building.glb')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='a996364ecc1b1ff33cd01fbe807f0c0537fa4189f6760db9e4b8f9112266c15c'
          Path('probe-source/hello.json').write_text(json.dumps({'project':'CityCode','test':'Release resource storage','status':'ok'})+'\n')
          PY
          if ! gh release view "${PROBE_TAG}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            gh release create "${PROBE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft --target "${GITHUB_SHA}" --title "Temporary resource-storage test" --notes "Small read-only storage/connectivity experiment. Draft release in the existing private repository. No production website change."
          fi
          gh release upload "${PROBE_TAG}" probe-source/building.glb probe-source/hello.json --repo "${GITHUB_REPOSITORY}" --clobber
          gh release download "${PROBE_TAG}" --repo "${GITHUB_REPOSITORY}" --pattern building.glb --pattern hello.json --dir probe-download
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${PROBE_TAG}" > release.json
          python - <<'PY'
          import hashlib,json,os,urllib.request,urllib.error
          from pathlib import Path
          release=json.loads(Path('release.json').read_text())
          rows=[]
          for asset in release['assets']:
              name=asset['name']
              original=Path('probe-source')/name
              restored=Path('probe-download')/name
              sha=hashlib.sha256(original.read_bytes()).hexdigest()
              assert restored.stat().st_size==original.stat().st_size
              assert hashlib.sha256(restored.read_bytes()).hexdigest()==sha
              request=urllib.request.Request(asset['browser_download_url'],headers={'Origin':'https://cgjiahui.github.io','User-Agent':'CityCode storage connectivity test'})
              try:
                  with urllib.request.urlopen(request,timeout=20) as response:
                      status=response.status;allow=response.headers.get('Access-Control-Allow-Origin');response.read(4096)
              except urllib.error.HTTPError as error:
                  status=error.code;allow=error.headers.get('Access-Control-Allow-Origin')
              rows.append({'name':name,'bytes':restored.stat().st_size,'sha256':sha,'authenticated_download_verified':True,'anonymous_status':status,'anonymous_allow_origin':allow})
          report={'release_id':release['id'],'tag':release['tag_name'],'draft':release['draft'],'html_url':release['html_url'],'assets':rows,'main_branch_changed':False,'website_changed':False}
          Path('release-storage-report.json').write_text(json.dumps(report,indent=2)+'\n')
          print('CITYCODE_RELEASE_PROBE_RESULT='+json.dumps(report))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('Release attachment upload and authenticated read-back passed SHA256 verification.\n\n```json\n'+json.dumps(report,indent=2)+'\n```\n')
          PY
